name: Check the feed directory

# Run by hand after editing directory.json: fetches every listed feed through
# the relay and reports which ones work.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-directory.mjs
