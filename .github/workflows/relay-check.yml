name: Check the relay

# Run by hand (Actions → Check the relay → Run workflow) to test the live
# shared relay: it should return feeds, only feed links for web pages,
# and refuse everything else.
on:
  workflow_dispatch:
    inputs:
      relay:
        description: Relay address
        default: https://salareader-relay.jamal-akuna-matata.workers.dev
      urls:
        description: Optional feed addresses to try (space-separated), directly and through the relay
        default: ''

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          RELAY: ${{ inputs.relay }}
          URLS: ${{ inputs.urls }}
        run: |
          fail=0
          check() { # name, expected status, curl args...
            name=$1; want=$2; shift 2
            got=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 "$@")
            if [ "$got" = "$want" ]; then mark=PASS; else mark=FAIL; fail=1; fi
            printf '%-4s %-38s got %s, want %s: %s\n' "$mark" "$name" "$got" "$want" "$(head -c 100 /tmp/body | tr '\n' ' ')"
          }
          O='Origin: https://reader.sala.company'
          check "feed (xkcd)"                     200 -H "$O" "$RELAY/?url=https://xkcd.com/atom.xml"
          check "web page gives feed links only"  200 -H "$O" "$RELAY/?url=https://simonwillison.net/"
          check "non-feed is refused"             415 -H "$O" "$RELAY/?url=https://raw.githubusercontent.com/jamalxcode/salareader/main/feeds.json"
          check "private address is refused"      400 -H "$O" "$RELAY/?url=http://127.0.0.1/"
          check "redirect to a feed is followed"  200 -H "$O" "$RELAY/?url=http://xkcd.com/atom.xml"
          check "other websites are refused"      403 -H "Origin: https://example.com" "$RELAY/?url=https://xkcd.com/atom.xml"
          check "no origin is refused"            403 "$RELAY/?url=https://xkcd.com/atom.xml"
          check "old address still allowed"       200 -H "Origin: https://salareader.sala.company" "$RELAY/?url=https://xkcd.com/atom.xml"
          curl -s -D - -o /dev/null -H "$O" "$RELAY/?url=https://simonwillison.net/" | grep -i '^x-relay-kind' || { echo "FAIL missing X-Relay-Kind header (old relay code?)"; fail=1; }
          for u in $URLS; do
            enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$u")
            : > /tmp/d; : > /tmp/r
            d=$(curl -s -o /tmp/d -w '%{http_code} %{content_type} %{url_effective}' -L --max-time 30 -A 'SalaReader/1.0 (+https://reader.sala.company)' "$u" || echo "failed (curl $?)")
            r=$(curl -s -o /tmp/r -w '%{http_code}' --max-time 30 -H "$O" "$RELAY/?url=$enc" || echo "failed (curl $?)")
            echo "URL    $u"
            echo "  direct: $d :: $(head -c 120 /tmp/d | tr '\n' ' ')"
            echo "  relay:  $r :: $(head -c 160 /tmp/r | tr '\n' ' ')"
            echo "  items in relay answer: $(grep -o '<item>\|<item \|<entry>\|<entry ' /tmp/r | wc -l)"
            # How the first items identify themselves (guid / link), twice, to spot ids that change.
            for k in 1 2; do
              curl -s -L --max-time 30 -A "SalaReader/1.0 (+https://reader.sala.company)" "$u" > /tmp/r$k || true; sleep 2
              echo "  ids (direct $k): $(grep -o '<guid[^>]*>[^<]*</guid>\|<link>[^<]*</link>\|<id>[^<]*</id>' /tmp/r$k | sed -n '2,5p' | tr '\n' ' ' | head -c 400)"
            done
          done
          exit $fail
